<!DOCTYPE html>
<html>
<head>
<style>
.grid-container {
  display: grid;
  grid-template-columns: 100PX 20PX auto;

}

.grid-container > div {
  background-color: #f1f1f1;
}

.item1 {
  grid-column-start: 1;
  grid-column-end: 3;
}
</style>
</head>
<body>


<div class="grid-container">
  <div class="item1">1</div>
  <div>2</div>
  <div >3</div>  
  <div >4</div>
  <div >5</div>
  <div >6</div>
  <div >7</div>
  <div >8</div>  
</div>

</body>
</html>
