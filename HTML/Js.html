<!DOCTYPE html>
<html>
<body>
    <h2>What can Java Script Do?</h2>
    <p id="demo" style="display: block">Java script can change the html conent </p>
    <button type="button" onclick='document.getElementById("demo").innerHTML="Hello java script"'>Click Me</button>
    <button type="button" onclick='document.getElementById("demo").style.fontSize="60px"'>Click Me</button>
    <button type="button" onclick='document.getElementById("demo").style.display="none"'>Click Me</button>
    <button type="button" onclick='document.getElementById("demo").style.display="block";document.getElementById("demo").style.fontSize="35px";'>Click Me</button>

</body>
</html>
