<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="WebPage.js" defer></script>
    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --bg-gradient-start: #EEF2FF;
            --bg-gradient-end: #C7D2FE;
            --surface-color: #FFFFFF;
            --text-primary: #111827;
            --text-secondary: #4B5563;
            --border-color: #D1D5DB;
            --error-color: #DC2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            color: var(--text-primary);
        }

        .registration-container {
            background-color: var(--surface-color);
            padding: 2.5rem 3rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 600px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header h1 {
            font-size: 1.875rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .form-header p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
            background-color: #F9FAFB;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
            background-color: #FFFFFF;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .checkbox-group,
        .radio-group {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            margin-top: 0.5rem;
        }

        .checkbox-item,
        .radio-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            border: 1px dashed var(--border-color);
            border-radius: 0.5rem;
            cursor: pointer;
            background-color: #F9FAFB;
        }

        input[type="file"]::file-selector-button {
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            border: none;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            margin-right: 1rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: var(--primary-hover);
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.75rem;
            margin-top: 0.25rem;
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        @media (max-width: 640px) {
            .form-row {
                flex-direction: column;
                gap: 1.5rem;
            }

            .registration-container {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="registration-container">
        <div class="form-header">
            <h1>Central Registration</h1>
            <p>Please fill out the form below to create your student account</p>
        </div>

        <form name="f1" onsubmit="event.preventDefault(); if(typeof checkValidation === 'function') checkValidation();">

            <div class="form-row">
                <div class="form-group">
                    <label for="id">Student ID</label>
                    <input type="text" id="id" name="id" placeholder="Enter your ID" required>
                </div>

                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                    <span id="nameError" class="error-message"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Student Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Student Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <label class="radio-item"><input type="radio" name="gender" value="Male" required> Male</label>
                        <label class="radio-item"><input type="radio" name="gender" value="Female" required>
                            Female</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Sports Interests</label>
                <div class="checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" name="cricket" value="Cricket"> Cricket</label>
                    <label class="checkbox-item"><input type="checkbox" name="Football" value="Football">
                        Football</label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="optSub1">Optional Subjects 1</label>
                    <select name="optSub1" id="optSub1">
                        <option value="" disabled selected>Select an option</option>
                        <option value="c">C</option>
                        <option value="java">Java</option>
                        <option value="jSon">JSON</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="optSub2">Optional Subjects 2</label>
                    <select name="optSub2" id="optSub2">
                        <option value="" disabled selected>Select an option</option>
                        <option value="c">C</option>
                        <option value="java">Java</option>
                        <option value="jSon">JSON</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="photo">Student Photo</label>
                <input type="file" id="photo" name="photo" accept="image/*">
            </div>

            <div class="form-group">
                <label for="address">Student Address</label>
                <textarea id="address" name="address" placeholder="Enter your full address..." rows="4"></textarea>
            </div>

            <button type="submit" name="register" class="submit-btn" id="submitBtn">Submit Registration</button>

        </form>
    </div>

</body>

</html>
