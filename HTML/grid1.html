<html>
    <header>
        <style>
            .container{
                display: grid;
                column-gap: 50px;
                row-gap: 50px;
                grid-template-columns: 70px 70px 70px;
                grid-template-rows: auto auto auto auto auto;
                place-content: end space-between;
            }
            .container > div {
                background-color: #6028e2;
                 color:#000;
                 padding: 10px;
                 font-size: 30px;
                 text-align: center;
            }
            .item1{
                grid-column-start: 1;
                grid-column-end: 3;
            }
            .item2{
                grid-column-start: 1;
                grid-column-end: 2;
            }
            .item3{
                grid-row: 1 / span 3;
            }
            .item4{
                grid-column: 1 / 4;
            } 
            .item5{
                grid-area: 1 / 3 / 2 / 3;
            } 
        </style>
    </header>
    <body>
        <div class="container">
            <div class="item3">1
            </div>
            <div class="item1">2
            </div>
            <div class="item2">3
            </div>
            <div class="item4">4
            </div>
            <div class="item5">5
            </div>
            <div>6
            </div>
        </div>
    </body>
</html>
